version: '3.8'

services:
  dify-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dify-web
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - VITE_APP_ID=491fc3da-cfb3-4727-9741-b735a49f9bae
      - VITE_API_KEY=app-tGFAlJQY860J7QBTsmZFrZTp
      - VITE_API_URL=http://193.112.190.60/v1
      - VITE_DEFAULT_INPUTS="{}"
    volumes:
      - ./public:/usr/share/nginx/html/public
    networks:
      - dify-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  dify-network:
    driver: bridge 